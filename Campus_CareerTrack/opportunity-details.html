<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Opportunity Details | Campus CareerTrack</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

  <div class="app-container">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Collapsible Sidebar -->
    <aside class="sidebar" id="appSidebar">
      <div class="sidebar-header">
        <a href="index.html" class="sidebar-brand">
          <div class="logo-icon"><i class="fa-solid fa-graduation-cap"></i></div>
          <span>CareerTrack</span>
        </a>
        <button type="button" class="sidebar-collapse-btn" id="sidebarCollapseBtn" title="Collapse sidebar">
          <i class="fa-solid fa-bars"></i>
        </button>
      </div>

      <div class="sidebar-nav-container">
        <div class="nav-section-title">Menu</div>
        <ul class="sidebar-nav">
          <li>
            <a href="dashboard.html" class="nav-item">
              <i class="fa-solid fa-table-columns"></i>
              <span class="nav-text">Dashboard</span>
            </a>
          </li>
          <li>
            <a href="opportunities.html" class="nav-item active">
              <i class="fa-solid fa-briefcase"></i>
              <span class="nav-text">Opportunities</span>
              <span class="nav-badge">12</span>
            </a>
          </li>
          <li>
            <a href="applications.html" class="nav-item">
              <i class="fa-solid fa-list-check"></i>
              <span class="nav-text">My Applications</span>
            </a>
          </li>
          <li>
            <a href="saved-opportunities.html" class="nav-item">
              <i class="fa-solid fa-bookmark"></i>
              <span class="nav-text">Saved Jobs</span>
            </a>
          </li>
          <li>
            <a href="eligibility.html" class="nav-item">
              <i class="fa-solid fa-wand-magic-sparkles"></i>
              <span class="nav-text">Eligibility Checker</span>
            </a>
          </li>
        </ul>

        <div class="nav-section-title">Account & Tools</div>
        <ul class="sidebar-nav">
          <li>
            <a href="notifications.html" class="nav-item">
              <i class="fa-solid fa-bell"></i>
              <span class="nav-text">Notifications</span>
              <span class="nav-badge notification-badge" style="display: none;">0</span>
            </a>
          </li>
          <li>
            <a href="profile.html" class="nav-item">
              <i class="fa-solid fa-user-graduate"></i>
              <span class="nav-text">Student Profile</span>
            </a>
          </li>
          <li>
            <a href="settings.html" class="nav-item">
              <i class="fa-solid fa-gear"></i>
              <span class="nav-text">Settings & Demo</span>
            </a>
          </li>
        </ul>
      </div>

      <div class="sidebar-footer">
        <a href="profile.html" class="sidebar-user-card" title="View Profile">
          <div class="avatar user-avatar-display">PK</div>
          <div class="user-meta">
            <div class="user-name-display">Priti Kumari</div>
            <div class="user-role-display">B.E. CSE Student</div>
          </div>
        </a>
      </div>
    </aside>

    <!-- Main Content Area -->
    <div class="main-content-wrapper">
      <header class="topbar">
        <div class="topbar-left">
          <button type="button" class="mobile-menu-btn" id="mobileMenuToggle" aria-label="Open menu">
            <i class="fa-solid fa-bars"></i>
          </button>
          
          <div class="topbar-search">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" class="global-search-input" placeholder="Search roles or companies..." />
          </div>
        </div>

        <div class="topbar-right">
          <button type="button" class="theme-toggle-btn" onclick="App.toggleTheme()">
            <i class="fa-solid fa-moon"></i><span class="theme-text">Dark Mode</span>
          </button>

          <a href="notifications.html" class="topbar-action-btn" title="Notifications">
            <i class="fa-solid fa-bell"></i>
            <span class="notification-badge" style="display: none;">0</span>
          </a>

          <a href="profile.html" class="avatar user-avatar-display" title="Student Profile">PK</a>
        </div>
      </header>

      <main class="page-container" id="detailsContainer">
        <!-- Back Navigation Link -->
        <div style="margin-bottom: 1.5rem;">
          <a href="opportunities.html" class="btn btn-sm btn-outline-secondary">
            <i class="fa-solid fa-arrow-left"></i> Back to Opportunities
          </a>
        </div>

        <!-- Banner with Company Details -->
        <div class="details-banner" id="detailsBanner">
          <!-- Populated by js/opportunity-details.js -->
        </div>

        <!-- 2-Column Details Layout -->
        <div class="details-layout">
          <!-- Main Content: Description, Responsibilities, Skills, Rounds -->
          <div class="details-main-col" id="detailsContent">
            <!-- Populated by js/opportunity-details.js -->
          </div>

          <!-- Sticky Sidebar: Overview Specs, Apply Button, Eligibility Link -->
          <aside class="details-sidebar-col" id="detailsSidebar">
            <!-- Populated by js/opportunity-details.js -->
          </aside>
        </div>
      </main>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script src="js/opportunity-details.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      OpportunityDetailsController.init();
    });
  </script>
</body>
</html>
